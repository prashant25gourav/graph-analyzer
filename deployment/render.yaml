# Render Blueprint — backend Web Service (native Python runtime).
#
# Deploys the FastAPI backend from apps/backend. Render provides the PORT
# environment variable; the start command binds 0.0.0.0:$PORT.
#
# After the first deploy, set/adjust these in the Render dashboard:
#   - GROQ_API_KEY          (secret; never commit it)
#   - CORS_ALLOWED_ORIGINS  (set to your deployed frontend URL once it exists)
services:
  - type: web
    name: graph-analyzer-api
    runtime: python
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      # Comma-separated list of allowed browser origins. Defaults to local dev;
      # update to your frontend's public URL after deploying it.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: GROQ_API_KEY
        sync: false
